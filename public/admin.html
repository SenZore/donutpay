<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DonutPay Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">
<style>
  :root { color-scheme: dark;
    --bg:#09090b; --card:#101013; --card2:#18181c; --line:#27272a; --txt:#fafafa; --dim:#a1a1aa;
    --acc:#f59e0b; --ok:#22c55e; --err:#ef4444; --radius:10px;
  }
  * { box-sizing:border-box; margin:0 }
  body { font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px }
  input, select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; color:var(--txt); font-size:13.5px; outline:none }
  input:focus { border-color:var(--acc) }
  label { display:block; font-size:12px; font-weight:500; color:var(--dim); margin:12px 0 5px }
  .btn { background:var(--acc); color:#0c0a04; font-weight:600; font-size:13.5px; border:0; border-radius:8px; padding:10px 16px; cursor:pointer }
  .btn:disabled { opacity:.45 }
  .btn.ghost { background:transparent; color:var(--dim); border:1px solid var(--line) }
  .btn.ghost:hover { color:var(--txt) }
  .btn.sm { padding:5px 10px; font-size:12px }
  .hidden { display:none }
  /* layout */
  .topbar { display:flex; align-items:center; gap:12px; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--card) }
  .topbar h1 { font-size:15px; font-weight:700 }
  .topbar .spacer { flex:1 }
  .badge { font-size:11px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--dim) }
  .badge.on { color:var(--ok); border-color:rgba(34,197,94,.4) }
  .badge.off { color:var(--err); border-color:rgba(239,68,68,.4) }
  .main { max-width:1100px; margin:0 auto; padding:24px }
  .grid { display:grid; gap:14px }
  .stats { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)) }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px }
  .stat .k { font-size:11.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em }
  .stat .v { font-size:22px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums }
  .cols { grid-template-columns:1fr; margin-top:14px }
  @media (min-width:900px) { .cols { grid-template-columns:2fr 1fr } }
  table { width:100%; border-collapse:collapse; font-size:12.5px }
  th { text-align:left; color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--line) }
  td { padding:8px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums }
  tr:last-child td { border-bottom:0 }
  .st { font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px }
  .st.pending { background:rgba(245,158,11,.12); color:var(--acc) }
  .st.paid { background:rgba(59,130,246,.12); color:#60a5fa }
  .st.delivered { background:rgba(34,197,94,.12); color:var(--ok) }
  .st.canceled, .st.expired { background:rgba(239,68,68,.12); color:var(--err) }
  .logs { font-family:ui-monospace,monospace; font-size:11px; max-height:320px; overflow-y:auto }
  .logs div { padding:3px 0; color:var(--dim); border-bottom:1px solid var(--card2) }
  .logs .error { color:var(--err) } .logs .warn { color:var(--acc) }
  .tabs { display:flex; gap:4px; margin-bottom:14px }
  .tab { font-size:12.5px; padding:7px 14px; border-radius:8px; border:1px solid transparent; color:var(--dim); cursor:pointer; background:transparent }
  .tab.active { background:var(--card2); border-color:var(--line); color:var(--txt) }
  .msg { font-size:12.5px; margin-top:10px; min-height:16px }
  .msg.err { color:var(--err) } .msg.ok { color:var(--ok) }
  .row { display:flex; gap:10px } .row > * { flex:1 }
  .muted { color:var(--dim); font-size:12px }
</style>
</head>
<body>
<!-- LOGIN -->
<div class="center" id="loginview">
  <div class="card" style="width:100%;max-width:340px">
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:30px">🍩</div>
      <h1 style="font-size:17px;margin-top:4px">DonutPay Admin</h1>
    </div>
    <label>Username</label>
    <input id="luser" autocomplete="username">
    <label>Password</label>
    <input id="lpass" type="password" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:18px" id="loginbtn">Masuk</button>
    <p class="msg err" id="lmsg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashview" class="hidden">
  <div class="topbar">
    <span style="font-size:18px">🍩</span>
    <h1>DonutPay Admin</h1>
    <span class="badge" id="provbadge">—</span>
    <span class="badge" id="botbadge">—</span>
    <div class="spacer"></div>
    <button class="btn ghost sm" onclick="dl('orders')">orders.csv</button>
    <button class="btn ghost sm" onclick="dl('logs')">logs.csv</button>
    <button class="btn ghost sm" id="logoutbtn">Logout</button>
  </div>

  <div class="main">
    <div class="grid stats" id="statsrow"></div>

    <div class="tabs" style="margin-top:20px">
      <button class="tab active" data-tab="orders">Orders</button>
      <button class="tab" data-tab="manual">Order Manual (Gratis)</button>
      <button class="tab" data-tab="logs">Logs</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <div id="tab-orders" class="card" style="padding:8px 0;overflow-x:auto">
      <table>
        <thead><tr><th>ID</th><th>User</th><th>Amt</th><th>Rp</th><th>Status</th><th>Waktu</th><th></th></tr></thead>
        <tbody id="orderrows"></tbody>
      </table>
    </div>

    <div id="tab-manual" class="card hidden" style="max-width:420px">
      <p class="muted">Bikin order langsung paid tanpa pembayaran. Bot langsung kirim donut. Stok harus cukup.</p>
      <label>Username Minecraft</label>
      <input id="muser" maxlength="16">
      <label>Jumlah (juta donut)</label>
      <input id="mamt" type="number" min="1" max="1000" value="5">
      <button class="btn" style="margin-top:16px" id="mcreate">Kirim Donut →</button>
      <p class="msg" id="mmsg"></p>
    </div>

    <div id="tab-logs" class="card hidden"><div class="logs" id="logbox"></div></div>

    <div id="tab-settings" class="card hidden" style="max-width:420px">
      <label>Rate (Rp per 1 juta donut)</label>
      <input id="srate" type="number" min="1">
      <label style="display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer">
        <input id="sstock" type="checkbox" style="width:auto"> Tampilkan stok di landing page
      </label>
      <button class="btn" style="margin-top:18px" id="ssave">Simpan</button>
      <p class="msg" id="smsg"></p>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
